<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JARVIS Mobile</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(circle,#06313d 0,#020b12 45%,#000 100%);color:#00eaff;font-family:Arial,sans-serif}
.wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{position:absolute;top:35px;margin:0;font-size:32px;letter-spacing:8px;text-shadow:0 0 8px #00eaff,0 0 25px #00eaff}.status{position:absolute;top:78px;font-size:11px;letter-spacing:3px}
.core{width:220px;height:220px;border:2px solid #00eaff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px #00eaff,inset 0 0 35px #00eaff;animation:pulse 2s infinite;position:relative}
.core:before{content:"";position:absolute;width:165px;height:165px;border:2px dashed #00eaff;border-radius:50%;animation:spin 8s linear infinite}
.core:after{content:"";position:absolute;width:105px;height:105px;border:3px solid #00eaff;border-radius:50%;box-shadow:0 0 25px #00eaff;animation:spinr 5s linear infinite}
.eye{width:42px;height:42px;border-radius:50%;background:#00eaff;box-shadow:0 0 20px #00eaff,0 0 55px #00eaff;z-index:2}
.response{margin-top:35px;text-align:center;width:92%;max-width:430px;min-height:55px;line-height:1.5;text-shadow:0 0 10px #00eaff}
.mic{margin-top:22px;width:75px;height:75px;border-radius:50%;border:2px solid #00eaff;background:#001820;color:#00eaff;font-size:30px;box-shadow:0 0 20px #00eaff,inset 0 0 15px #00eaff}
.mic:active{transform:scale(.9)}.commands{position:absolute;bottom:20px;width:92%;text-align:center;font-size:10px;opacity:.8}.commands span{display:inline-block;margin:3px;padding:6px 9px;border:1px solid #007a8a;border-radius:20px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}@keyframes pulse{50%{transform:scale(1.04)}}
</style>
</head>
<body>
<div class="wrap">
<h1>JARVIS</h1><div class="status" id="status">SISTEMA ONLINE</div>
<div class="core" id="core"><div class="eye"></div></div>
<div class="response" id="response">Buenas noches. Soy JARVIS.<br>Presioná el micrófono y hablame.</div>
<button class="mic" onclick="listen()">🎙️</button>
<div class="commands"><span>“Abrí WhatsApp”</span><span>“Abrí YouTube”</span><span>“Abrí Instagram”</span><span>“Abrí Spotify”</span></div>
</div>
<script>
const apps={
 whatsapp:["WhatsApp","whatsapp://"],youtube:["YouTube","youtube://"],
 instagram:["Instagram","instagram://"],spotify:["Spotify","spotify://"],
 tiktok:["TikTok","tiktok://"],telegram:["Telegram","tg://"]
};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=SR?new SR():null;
if(rec){rec.lang="es-AR";rec.interimResults=false;rec.continuous=false;
rec.onstart=()=>{status("ESCUCHANDO...");response("Te escucho.");};
rec.onend=()=>{status("SISTEMA ONLINE");core.style.animation="pulse 2s infinite";};
rec.onerror=()=>{say("No pude escucharte.");status("SISTEMA ONLINE");};
rec.onresult=e=>command(e.results[0][0].transcript.toLowerCase());}
function listen(){if(!rec){alert("Probá con Safari o Chrome y permití el micrófono.");return}try{rec.start()}catch(e){}}
function command(c){
for(const k in apps)if(c.includes(k)){let [name,url]=apps[k];response("Intentando abrir "+name+"...");say("Claro. Intentando abrir "+name);setTimeout(()=>location.href=url,900);return}
if(c.includes("hola")||c.includes("jarvis"))return say("Buenas noches. ¿En qué puedo ayudarte?");
if(c.includes("cómo estás")||c.includes("como estas"))return say("Todos mis sistemas funcionan correctamente.");
if(c.includes("qué hora")||c.includes("que hora"))return say("Son las "+new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}));
say("No tengo configurado ese comando todavía.");
}
function say(t){speechSynthesis.cancel();let s=new SpeechSynthesisUtterance(t);s.lang="es-AR";s.rate=.95;s.pitch=.8;speechSynthesis.speak(s)}
function response(t){document.getElementById("response").innerText=t}
function status(t){document.getElementById("status").innerText=t}
const core=document.getElementById("core");
</script>
</body>
</html>
